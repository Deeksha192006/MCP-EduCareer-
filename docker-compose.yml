version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_career_guidance
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_career_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=career_guidance_db
      - JWT_SECRET=production-secret-key-2026
    depends_on:
      - mongodb

volumes:
  mongo_data:
